<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tris 🎲 — The Social Friends (online)</title>
<style>
 :root{--bg:#12121a;--fg:#f3f3f7;--acc:#7c5cff;--acc2:#ff5c8a;--card:#1c1c28}
 *{box-sizing:border-box}
 body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:radial-gradient(1200px 600px at 50% -10%,#241f45,var(--bg));color:var(--fg);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
 .wrap{width:100%;max-width:520px}
 h1{margin:0 0 4px;font-size:26px}
 .sub{color:#8f8fa8;font-size:13px;margin-bottom:16px}
 .board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:360px;margin:0 auto}
 .cell{aspect-ratio:1;border-radius:16px;background:var(--card);border:1px solid #2b2b3d;display:flex;align-items:center;justify-content:center;font-size:56px;font-weight:800;cursor:pointer;transition:.15s transform,.15s background;user-select:none}
 .cell:hover{background:#242438;transform:translateY(-2px)}
 .cell.x{color:var(--acc);text-shadow:0 0 24px rgba(124,92,255,.6)}
 .cell.o{color:var(--acc2);text-shadow:0 0 24px rgba(255,92,138,.6)}
 .cell.win{animation:pop .4s ease}
 @keyframes pop{50%{transform:scale(1.12);background:#2b2b45}}
 .status{text-align:center;margin:18px 0 10px;font-size:18px;min-height:26px}
 .status b{color:var(--acc)}
 .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
 button{background:var(--acc);color:#fff;border:0;padding:10px 16px;border-radius:10px;font-size:14px;cursor:pointer;font-weight:600}
 button.ghost{background:#2b2b3d}
 .scores{margin-top:22px;background:var(--card);border:1px solid #2b2b3d;border-radius:14px;padding:14px 16px}
 .scores h3{margin:0 0 10px;font-size:14px;color:#8f8fa8;text-transform:uppercase;letter-spacing:1px}
 .srow{display:flex;justify-content:space-between;padding:5px 0;font-size:14px;border-bottom:1px solid #26263a}
 .srow:last-child{border:0}
 .srow span:last-child{font-weight:700;color:var(--acc)}
 input{background:#23233a;border:1px solid #33334d;color:var(--fg);border-radius:10px;padding:8px 12px;font-size:14px;text-align:center}
 #code{width:190px;letter-spacing:1px}
 .names{display:flex;gap:8px;justify-content:center;margin-bottom:14px}
 .names input{width:130px}
 .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#2b2b45;padding:10px 18px;border-radius:12px;font-size:14px;opacity:0;transition:.3s;z-index:9}
 .toast.show{opacity:1}
 .tag{font-size:12px;color:#8f8fa8;text-align:center;display:block}
 .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#44445c;margin-right:6px;vertical-align:middle}
 .dot.on{background:#3ddc84;box-shadow:0 0 8px #3ddc84}
</style>
</head>
<body>
<div class="wrap">
  <h1>Tris 🎲</h1>
  <div class="sub">The Social Friends — online via WebRTC (relay MQTT)</div>

  <div class="row">
    <input id="myname" placeholder="Il tuo nome" maxlength="14">
  </div>
  <div class="row">
    <input id="code" placeholder="CODICE STANZA" maxlength="20">
  </div>
  <div class="row">
    <button onclick="joinRoom()">Entra / crea stanza</button>
    <button class="ghost" onclick="copyCode()">Copia codice</button>
  </div>
  <div class="row"><span class="tag"><span class="dot" id="dot"></span><span id="roomTag">Non connesso</span></span></div>

  <div class="names">
    <input id="px" placeholder="Giocatore X" maxlength="12">
    <input id="po" placeholder="Giocatore O" maxlength="12">
  </div>

  <div class="board" id="board"></div>
  <div class="status" id="status">Entra con un codice stanza per iniziare</div>
  <div class="row">
    <button class="ghost" onclick="newGame()">Nuova partita</button>
    <button class="ghost" onclick="resetScores()">Azzera punteggi</button>
  </div>

  <div class="scores">
    <h3>Classifica</h3>
    <div class="srow"><span id="lnx">X</span><span id="scx">0</span></div>
    <div class="srow"><span id="lno">O</span><span id="sco">0</span></div>
    <div class="srow"><span>Pareggi</span><span id="scd">0</span></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script type="module">
import {joinRoom, selfId} from "https://cdn.jsdelivr.net/npm/trystero@0.21.0/mqtt/+esm";

const W=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
const APP='tris-social-friends-v1';
let room=null, myMark='', hostId='', peerId=null;
let board=Array(9).fill(''), turn='x', over=false;
let names={x:'Giocatore X',o:'Giocatore O'}, scores={x:0,o:0,d:0};
let stateMsg='Entra con un codice stanza per iniziare';

const el=id=>document.getElementById(id);
function toast(t){const e=el('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2000)}
function myName(){return el('myname').value.trim()||'Giocatore'}
function checkWin(b){for(const w of W){const[a,c,d]=w;if(b[a]&&b[a]===b[c]&&b[c]===b[d])return w}return null}

function render(){
  const b=el('board');b.innerHTML='';
  for(let i=0;i<9;i++){
    const c=document.createElement('div');
    c.className='cell '+(board[i]||'');
    c.textContent=board[i]==='x'?'✕':board[i]==='o'?'◯':'';
    c.onclick=()=>play(i);
    b.appendChild(c);
  }
  el('lnx').textContent=names.x;el('lno').textContent=names.o;
  el('scx').textContent=scores.x;el('sco').textContent=scores.o;el('scd').textContent=scores.d;
  el('status').innerHTML=stateMsg;
  el('dot').className='dot'+(room?' on':'');
}

function connect(code){
  try{ if(room&&room.leave) room.leave(); }catch(e){}
  room=joinRoom({appId:APP}, code);
  const [sendMove,getMove]=room.makeAction('move');
  const [sendState,getState]=room.makeAction('state');
  window.__sendMove=sendMove; window.__sendState=sendState;

  room.onPeerJoin(id=>{
    peerId=id;
    if(!hostId){ hostId=id; myMark='x'; names.x=myName(); names.o='Avversario';
      stateMsg='Avversario connesso! In attesa che si presenti.';
      render();
    }
    if(hostId===id && myMark==='x'){
      sendState({board,turn,over,names,scores,msg:stateMsg,mark:'x'});
      sendState({board,turn,over,names,scores,msg:stateMsg,mark:'o'});
    }
  });

  room.onPeerLeave(id=>{
    if(id===peerId){ peerId=null; stateMsg='Avversario uscito dalla stanza'; render(); }
  });

  getState((d,id)=>{
    if(d.mark){ myMark=d.mark; names.x=d.names.x; names.o=d.names.o; el('px').value=names.x; el('po').value=names.o; }
    board=d.board;turn=d.turn;over=d.over;scores=d.scores;stateMsg=d.msg||stateMsg;
    if(!hostId) hostId=id;
    render();
  });

  getMove((d,id)=>{
    board=d.board;turn=d.turn;over=d.over;if(d.scores)scores=d.scores;stateMsg=d.msg;render();
  });

  el('roomTag').textContent='Stanza «'+code+'» — ID '+selfId.slice(0,8);
  stateMsg='In attesa dell\'avversario… condividi il codice!';
  render();
  toast('Connesso alla stanza '+code);
}

function joinRoom(){
  const code=(el('code').value.trim()||'').replace(/\s+/g,'-');
  if(!code){toast('Scrivi un codice stanza');return}
  el('code').value=code;
  connect(code);
}
function copyCode(){
  const c=el('code').value.trim();
  if(!c){toast('Nessun codice');return}
  navigator.clipboard?.writeText(c).then(()=>toast('Codice copiato!'),()=>toast(c));
}

function play(i){
  if(!room){toast('Entra in una stanza prima');return}
  if(over||board[i])return;
  if(!myMark){toast('Attendi l\'avversario');return}
  if(turn!==myMark){toast('Non è il tuo turno');return}
  board[i]=myMark;
  const w=checkWin(board);
  if(w){
    over=true;scores[myMark]++;
    stateMsg='<b>'+(myMark==='x'?names.x:names.o)+'</b> vince! 🎉';
    w.forEach(j=>document.querySelectorAll('.cell')[j].classList.add('win'));
    toast('Vittoria di '+(myMark==='x'?names.x:names.o));
  } else if(board.every(x=>x)){
    over=true;scores.d++;stateMsg='Pareggio! 🤝';toast('Pareggio!');
  } else {
    turn=myMark==='x'?'o':'x';
    stateMsg='Turno di <b>'+(turn==='x'?names.x:names.o)+'</b>';
  }
  window.__sendMove({board,turn,over,scores,msg:stateMsg});
  render();
}

function newGame(){
  if(!room){toast('Entra in una stanza prima');return}
  if(myMark!=='x'){toast('Solo il giocatore X può riavviare');return}
  board=Array(9).fill('');turn='x';over=false;
  stateMsg='Nuova partita! <b>'+names.x+'</b> gioca';
  window.__sendMove({board,turn,over,scores,msg:stateMsg});
  render();
}
function resetScores(){
  if(!room){toast('Entra in una stanza prima');return}
  if(myMark!=='x'){toast('Solo X può azzerare');return}
  scores={x:0,o:0,d:0};
  window.__sendMove({board,turn,over,scores,msg:stateMsg});
  render();
}

render();
</script>
</body>
</html>
